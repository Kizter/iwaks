<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <g id="tile">
    <rect width="512" height="512" rx="112" fill="#191920"/>
  </g>
  <g id="icon">
    <!-- tail fins -->
    <path d="M348 196 C 400 176, 416 200, 408 232 C 430 218, 432 250, 406 264 C 424 282, 404 312, 356 292 Z" fill="#c3b8f0"/>
    <!-- cassette body -->
    <rect x="104" y="156" width="248" height="200" rx="36" fill="#f2a0b5"/>
    <rect x="128" y="184" width="200" height="18" rx="9" fill="#191920" opacity="0.14"/>
    <!-- reels -->
    <circle cx="180" cy="282" r="44" fill="#191920" opacity="0.16"/>
    <circle cx="180" cy="282" r="26" fill="#8fc7e8"/>
    <circle cx="180" cy="282" r="10" fill="#191920"/>
    <circle cx="272" cy="282" r="44" fill="#191920" opacity="0.16"/>
    <circle cx="272" cy="282" r="26" fill="#8fc7e8"/>
    <circle cx="272" cy="282" r="10" fill="#191920"/>
    <!-- head / eye -->
    <circle cx="196" cy="214" r="26" fill="#ffffff"/>
    <circle cx="206" cy="210" r="12" fill="#191920"/>
    <circle cx="211" cy="205" r="4" fill="#ffffff"/>
    <!-- smile -->
    <path d="M128 330 Q 156 348 178 334" stroke="#191920" stroke-width="12" stroke-linecap="round" fill="none"/>
    <!-- gill -->
    <path d="M122 232 Q 118 252 130 266" stroke="#191920" stroke-width="10" stroke-linecap="round" fill="none" opacity="0.5"/>
    <!-- floating note -->
    <path d="M366 128 l 0 -34 c 26 -6 44 -2 50 12 l 0 26 c -8 4 -18 6 -30 4 l 0 -22 c -6 -2 -13 -3 -20 14 Z" fill="#8fc7e8"/>
    <circle cx="356" cy="130" r="12" fill="#8fc7e8"/>
  </g>
</svg>