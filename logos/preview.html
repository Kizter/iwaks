<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iwaks — Maskot (konsep)</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 2rem; background: #f4f6ea; color: #26405c; }
  .header { margin-bottom: 1.5rem; }
  h1 { font-size: 1.5rem; font-weight: 700; }
  .sub { color: #026aa7; margin-top: 0.25rem; }
  .hero { display: flex; gap: 2rem; align-items: flex-start; flex-wrap: wrap; }
  .card { background: #fff; border: 2px solid #026aa7; border-radius: 16px; padding: 1.5rem; }
  .card h2 { font-size: 1.1rem; margin-bottom: 1rem; color: #026aa7; }
  .sizes { display: flex; gap: 1rem; align-items: flex-end; flex-wrap: wrap; background: #fff; border: 2px solid #026aa7; border-radius: 16px; padding: 1.5rem; margin-top: 1.5rem; }
  .sizes h2 { width: 100%; font-size: 1.1rem; color: #026aa7; }
  .cell { text-align: center; }
  .cell span { display: block; font-size: 0.75rem; color: #26405c; margin-top: 0.4rem; }
</style>
</head>
<body>
  <div class="header">
    <h1>🐟 Iwaks — Maskot Konsep Digital</h1>
    <div class="sub">Sketsa tangan → vektor: tinta biru #026aa7 · isian mint · highlight es · latar krem</div>
  </div>

  <div class="card">
    <h2>Ikut sketsa kamu: ikan (koi) + kaset + not musik</h2>
    <img src="concept-halo/iwaks-mascot.svg" alt="Iwaks mascot" width="384" height="384">
  </div>

  <div class="sizes">
    <h2>Uji ketajaman (favicon kecil → app icon)</h2>
    <div class="cell"><img src="concept-halo/iwaks-mascot.svg" width="16" height="16" alt="16"><span>16px</span></div>
    <div class="cell"><img src="concept-halo/iwaks-mascot.svg" width="24" height="24" alt="24"><span>24px</span></div>
    <div class="cell"><img src="concept-halo/iwaks-mascot.svg" width="32" height="32" alt="32"><span>32px</span></div>
    <div class="cell"><img src="concept-halo/iwaks-mascot.svg" width="48" height="48" alt="48"><span>48px</span></div>
    <div class="cell"><img src="concept-halo/iwaks-mascot.svg" width="128" height="128" alt="128"><span>128px</span></div>
    <div class="cell"><img src="concept-halo/iwaks-mascot.svg" width="256" height="256" alt="256"><span>256px</span></div>
  </div>
</body>
</html>
