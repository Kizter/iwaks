<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <filter id="rough" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="4"/>
    </filter>
  </defs>
  <g id="tile">
    <rect width="512" height="512" rx="112" fill="#141417"/>
  </g>
  <g id="icon" filter="url(#rough)">
    <!-- swirling fins form a note-like sweep (crayon layers) -->
    <path d="M288 250 C 356 170, 420 206, 388 262 C 430 250, 452 306, 404 330 Z" fill="#8fc7e8" stroke="#191920" stroke-width="9" stroke-linejoin="round"/>
    <path d="M300 300 C 366 268, 428 320, 386 376 C 414 408, 376 436, 328 396 Z" fill="#c3b8f0" stroke="#191920" stroke-width="9" stroke-linejoin="round"/>
    <!-- body -->
    <path d="M140 210 C 210 152, 316 166, 344 224 C 372 278, 356 344, 296 376 C 220 410, 130 380, 112 314 C 100 268, 112 224, 140 210 Z" fill="#f2a0b5" stroke="#191920" stroke-width="12" stroke-linejoin="round"/>
    <!-- belly -->
    <path d="M140 344 C 190 376, 260 382, 300 356 C 330 334, 344 306, 350 284" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" opacity="0.55"/>
    <!-- dorsal fin -->
    <path d="M196 176 C 212 120, 288 122, 298 184 Z" fill="#8fc7e8" stroke="#191920" stroke-width="8" stroke-linejoin="round"/>
    <!-- pelvics -->
    <path d="M216 356 C 206 402, 178 406, 178 376 Z" fill="#c3b8f0" stroke="#191920" stroke-width="8" stroke-linejoin="round"/>
    <path d="M256 362 C 252 404, 224 410, 224 382 Z" fill="#c3b8f0" stroke="#191920" stroke-width="8" stroke-linejoin="round"/>
    <!-- gill -->
    <path d="M192 250 Q 182 274 194 296" fill="none" stroke="#191920" stroke-width="8" stroke-linecap="round" opacity="0.5"/>
    <!-- eye -->
    <circle cx="176" cy="238" r="28" fill="#ffffff" stroke="#191920" stroke-width="9"/>
    <circle cx="185" cy="234" r="13" fill="#191920"/>
    <circle cx="190" cy="229" r="4.5" fill="#ffffff"/>
    <!-- blush -->
    <path d="M148 288 Q 158 300 170 292" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.8"/>
    <!-- smile -->
    <path d="M132 330 Q 156 350 178 334" fill="none" stroke="#191920" stroke-width="9" stroke-linecap="round"/>
    <!-- floating note -->
    <path d="M176 108 l 0 -24 c 16 -4 28 -1 32 8 l 0 24 c -4 2 -10 4 -16 3 l 0 -19 c -2 -3 -6 -4 -11 3 l 0 19 c -4 2 -10 4 -16 3 Z" fill="#8fc7e8" stroke="#191920" stroke-width="5" stroke-linejoin="round"/>
    <circle cx="168" cy="112" r="8" fill="#8fc7e8" stroke="#191920" stroke-width="5"/>
  </g>
</svg>