<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <filter id="rough" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="4"/>
    </filter>
  </defs>
  <g id="tile">
    <rect width="512" height="512" rx="112" fill="#141417"/>
  </g>
  <g id="icon" filter="url(#rough)">
    <!-- tail ribbon fins (crayon sky) -->
    <path d="M340 210 C 402 178, 428 216, 398 250 C 436 246, 452 292, 412 318 C 440 350, 408 386, 352 360 Z" fill="#8fc7e8" stroke="#191920" stroke-width="10" stroke-linejoin="round"/>
    <path d="M344 226 C 392 204, 406 252, 386 278 Z" fill="none" stroke="#191920" stroke-width="7" opacity="0.5"/>
    <!-- body (crayon blush) -->
    <path d="M138 198 C 216 148, 322 158, 356 208 C 388 254, 380 320, 324 352 C 240 392, 142 366, 116 302 C 98 258, 108 214, 138 198 Z" fill="#f2a0b5" stroke="#191920" stroke-width="12" stroke-linejoin="round"/>
    <!-- belly highlight -->
    <path d="M140 330 C 190 360, 260 362, 306 338 C 340 318, 352 296, 356 278" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" opacity="0.55"/>
    <!-- top fin -->
    <path d="M204 172 C 214 118, 288 118, 296 176 Z" fill="#c3b8f0" stroke="#191920" stroke-width="9" stroke-linejoin="round"/>
    <!-- barbels (kumis koi) -->
    <path d="M112 300 C 84 292, 74 306, 92 316" fill="none" stroke="#191920" stroke-width="9" stroke-linecap="round"/>
    <path d="M118 314 C 92 316, 86 332, 106 336" fill="none" stroke="#191920" stroke-width="9" stroke-linecap="round"/>
    <!-- eye -->
    <circle cx="196" cy="238" r="30" fill="#ffffff" stroke="#191920" stroke-width="10"/>
    <circle cx="206" cy="234" r="14" fill="#191920"/>
    <circle cx="211" cy="229" r="5" fill="#ffffff"/>
    <!-- smile -->
    <path d="M140 330 Q 168 350 190 336" fill="none" stroke="#191920" stroke-width="9" stroke-linecap="round"/>
    <!-- music note -->
    <path d="M388 176 l 0 -40 c 22 -6 38 -2 44 10 l 0 34 c -6 4 -14 6 -22 4 l 0 -26 c -4 -5 -10 -6 -16 4 l 0 28 c -6 4 -14 6 -22 4 Z" fill="#c3b8f0" stroke="#191920" stroke-width="6" stroke-linejoin="round"/>
    <circle cx="378" cy="182" r="11" fill="#c3b8f0" stroke="#191920" stroke-width="6"/>
    <!-- sparkles -->
    <path d="M96 130 l 6 14 14 6 -14 6 -6 14 -6 -14 -14 -6 14 -6 Z" fill="#8fc7e8"/>
    <path d="M424 424 l 5 12 12 5 -12 5 -5 12 -5 -12 -12 -5 12 -5 Z" fill="#f2a0b5"/>
  </g>
</svg>