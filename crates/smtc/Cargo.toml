[package]
name = "iwaks-smtc"
description = "Windows SMTC (System Media Transport Controls) session for the Iwaks player"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
windows = { version = "0.62", default-features = false, features = [
    "Foundation",
    "Media",
    "Media_Control",
    "Media_Core",
    "Media_MediaProperties",
    "Media_Playback",
    "Storage_Streams",
    "Win32_System_Com",
    "Win32_System_WinRT",
] }
# Named only by the ignored OS-enumeration test (AsyncStatus); already in the
# tree as a transitive dependency of `windows`.
windows-future = "0.3"