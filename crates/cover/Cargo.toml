[package]
name = "iwaks-cover"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Online album-art lookup for Rich Presence (the only crate that talks to the network)"

[dependencies]
serde.workspace = true
serde_json = "1"
thiserror.workspace = true
ureq = { version = "3", default-features = false, features = ["rustls", "gzip"] }

# Only the opt-in live smoke test fetches artwork bytes; it reuses the same
# client configuration as the lookup itself.
[dev-dependencies]
ureq = { version = "3", default-features = false, features = ["rustls", "gzip"] }